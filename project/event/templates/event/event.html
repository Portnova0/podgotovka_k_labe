<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h1>События</h1>
{% for event in events %}
<p>Название события: {{ event.name }}</p>
<p>Дата публикации: {{ event.date }}</p>
{% for attendee in event.attendee.all  %}
<p>Автор: {{ attendee }}</p>
{% endfor %}
<hr>
{% endfor %}
</body>
</html>
